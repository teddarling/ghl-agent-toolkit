[project]
name = "ghl-toolkit"
version = "0.1.0"
description = "Production patterns for putting AI agents to work inside GoHighLevel — safely."
authors = [
    { name = "Ted Darling", email = "ted@digitalspirittech.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
ghl = "ghl_toolkit.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ghl_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
